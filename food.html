<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Selection</title>
    <link rel="stylesheet" href="css/food.css" />
  </head>
  <body>
    <div id="foodquestion">
      <b>What food would you like to eat? My treat :)</b>
    </div>

    <div class="food-selection">
      <div class="food-item">
        <img src="food/chinese.jpg" alt="chinese" />
        <label
          ><input
            type="checkbox"
            name="food"
            value="chinese"
          />
          chinese food</label
        >
      </div>
      <div class="food-item">
        <img src="food/indian.jpg" alt="indian" />
        <label
          ><input type="checkbox" name="food" value="indian" /> indian food</label
        >
      </div>
      <div class="food-item">
        <img src="food/kebab.jpg" alt="kebab" />
        <label
          ><input type="checkbox" name="food" value="kebab" /> kebab
        </label
        >
      </div>
      <div class="food-item">
        <img src="food/pizza.jpeg" alt="pizza" />
        <label><input type="checkbox" name="food" value="pizza" /> pizza</label>
      </div>
      <div class="food-item">
        <img src="food/subway.jpeg" alt="subway" />
        <label><input type="checkbox" name="food" value="subway" /> subway</label>
      </div>
          <div class="food-item">
        <img src="food/sushi.jpeg" alt="sushi" />
        <label><input type="checkbox" name="food" value="sushi" /> sushi</label>
      </div>
    </div>
    <button class="button" onclick="location.href='dessert.html'">
      Continue stinky
    </button>
  </body>
</html>
