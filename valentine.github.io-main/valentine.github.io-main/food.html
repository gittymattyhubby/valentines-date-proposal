<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Selection</title>
    <link rel="stylesheet" href="css/food.css" />
  </head>
  <body>
    <div id="foodquestion">
      <b>What food would you like to eat? my treat :)</b>
    </div>

    <div class="food-selection">
      <div class="food-item">
        <img src="chinese.jpg" alt="dumplings, noodles and soup" />
        <label
          ><input
            type="checkbox"
            name="food"
            value="dumplings, noodles and soup"
          />
          chinese food</label
        >
      </div>
      <div class="food-item">
        <img src="indian.jpeg" alt="curry" />
        <label
          ><input type="checkbox" name="food" value="indian" /> indian</label
        >
      </div>
      <div class="food-item">
        <img src="kebab.jpg" alt="koreanfood" />
        <label
          ><input type="checkbox" name="food" value="kebab" />
          kebab</label
        >
      </div>
      <div class="food-item">
        <img src="kfc.jpeg" alt="fried chicken" />
        <label><input type="checkbox" name="food" value="kfc" /> kfc</label>
      </div>
      <div class="food-item">
        <img src="food/pizza.jpg" alt="pizza" />
        <label><input type="checkbox" name="food" value="pizza" /> pizza</label>
      </div>
      <div class="food-item">
        <img src="food/subway.jpeg" alt="subway" />
        <label><input type="checkbox" name="food" value="subway" /> subway</label>
      </div>
      <div class="food-item">
        <img src="sushi.jpg" alt="sushi" />
        <label><input type="checkbox" name="food" value="sushi" /> sushi</label>
      </div>
      
    <button class="button" onclick="location.href='dessert.html'">
      Continue stinky
    </button>
  </body>
</html>
